name: Build project and blueprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build the Lean project (with mathlib cache)
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          use-github-cache: true

      - name: Install blueprint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev
          pip install -r blueprint/requirements.txt

      - name: Build blueprint web version
        run: leanblueprint web

      - name: Check declarations
        run: |
          ls blueprint/lean_decls && ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Certificate hash audit
        run: |
          python3 - << 'EOF'
          import hashlib, pathlib, re, sys
          text = pathlib.Path("scripts/CERTIFICATES.md").read_text()
          rows = dict(re.findall(r"\| `([^`]+)` \| `([0-9a-f]{64})` \|", text))
          claim = text.split("## Chapter-4 claim map")[1].split("## File hashes")[0]
          cm_scripts = set(re.findall(r"([A-Za-z0-9_]+\.(?:sage|m))(?![a-zA-Z])", claim))
          cm_missing = [s for s in sorted(cm_scripts) if not list(pathlib.Path("scripts").rglob(s))]
          if cm_missing:
              print("FAIL: claim-map references scripts absent from the repository:", cm_missing); sys.exit(1)
          bad = []
          for p, h in rows.items():
              q = pathlib.Path(p)
              if not q.is_file(): bad.append("MISSING " + p); continue
              m = hashlib.sha256(q.read_bytes()).hexdigest()
              if m != h: bad.append("MISMATCH %s (table %s, actual %s)" % (p, h, m))
          for q in pathlib.Path("scripts").rglob("*"):
              if q.is_file() and q.name != "CERTIFICATES.md" and q.as_posix() not in rows:
                  bad.append("UNLISTED " + q.as_posix())
          if bad:
              print("CERTIFICATE AUDIT FAIL"); [print(" ", b) for b in bad]; sys.exit(1)
          print("CERTIFICATE AUDIT PASS (%d files)" % len(rows))
          EOF

      - name: Axiom footprint audit
        run: |
          set -uo pipefail
          out=""
          for f in Thm7Prime/Master.lean Thm7Prime/Fidelity.lean Thm7Prime/Classification.lean Gap/BMThm7Gap.lean Gap/BMThm7GapK.lean Gap/BMThm7Transcript.lean Gap/BMThm7Boundary.lean Gap/BMThm7FunctionField.lean Gap/BMThm7SquareClass.lean Gap/BMThm7NormCriterion.lean Gap/BMThm7Terrain.lean; do
            o=$(~/.elan/bin/lake env lean "$f" 2>&1) || { echo "FAIL: $f did not compile; output follows:"; echo "$o" | tail -40; exit 1; }
            out="$out$o"$'\n'
          done
          if echo "$out" | grep -q "sorryAx"; then echo "FAIL: sorryAx present"; exit 1; fi
          ax=$(echo "$out" | tr '\n' ' ' | grep -oE "depends on axioms: \[[^]]*\]")
          bad=$(echo "$ax" | grep -oE "\[[^]]*\]" | tr ',[]' '\n' | tr -d ' ' | sort -u | grep -vE "^(propext|Classical\.choice|Quot\.sound|Thm7Statement\.rank_E576i2)$" | grep -v "^$" || true)
          if [ -n "$bad" ]; then echo "FAIL: unexpected axioms:"; echo "$bad"; exit 1; fi
          if ! echo "$out" | grep -qF "'Thm7Statement.thm7prime' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: thm7prime footprint"; exit 1; fi
          if ! echo "$out" | grep -qF "'Thm7Fidelity.rd211_iff_natural' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: rd211_iff_natural footprint"; exit 1; fi
          if ! echo "$out" | grep -qF "'Thm7Classification.classification_by_curve' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: classification_by_curve footprint"; exit 1; fi
          if ! echo "$out" | grep -qF "'BMThm7SquareClass.Q4_not_square_multiquadratic' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: Q4_not_square_multiquadratic footprint"; exit 1; fi
          if ! echo "$out" | grep -qF "'BMThm7NormCriterion.gamma_not_square_multiquadratic' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: gamma_not_square_multiquadratic footprint"; exit 1; fi
          if ! echo "$out" | grep -qF "'BMThm7NormCriterion.RqSq_not_square' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: RqSq_not_square footprint"; exit 1; fi
          if ! echo "$out" | grep -qF "'BMThm7Terrain.conjecture1_iff_terrain' depends on axioms: [propext, Classical.choice, Quot.sound]"; then echo "FAIL: conjecture1_iff_terrain footprint"; exit 1; fi
          echo "AXIOM AUDIT PASS"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r blueprint/web _site/blueprint

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Pages not yet enabled on this repository: do not fail the workflow on deploy.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
